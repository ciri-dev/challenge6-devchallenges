<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perfect solution for small business blog card challenge from devChallenges.io">
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <body>
    <main>
      <section class="container">
        <div class="img-container">
          <img class="card-image" src="resources/hero-image-1.jpg" alt="imagen de un hombre con una laptop en la mano">
          <img class="overlay" src="resources/white-overlay.svg" alt="overlay blanco">
        </div>
        <div class="text-container">
          <h1>Perfect solution for small business</h1>
          <p>Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
        </div>
          <hr>
        <div class="avatar-container">
            <div class="item1">
              <img src="resources/avatar-image-business-card-1.png" alt="avatar de Amy Burgess">
            </div>
            <div class="item2">
              <p class="bold">Amy Burgess</p>
              <p>Customer Manager, Solution Oy</p>
            </div>
        </div>
      </section>
    </main>

    <div class="author-info">
      Coded by <a href="https://github.com/ciri-dev" target="_blank">ciri-dev</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
